# Clean, fast tmux for the S10 terminal
set -g default-terminal "tmux-256color"
# fbterm's "oc" (ESC ] R) resets its palette, which would undo the amber colours
set -as terminal-overrides ",fbterm:oc@"
set -sg escape-time 0
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
# Amber phosphor: colours 0-15 are the palette s10-term loads into fbterm
# (7 = amber text, 8 = dim amber, 12 = bright highlight).
set -g status-position top
set -g status-style "bg=colour0,fg=colour8"
set -g status-left ""
set -g status-right "#(s10-status)"
set -g status-right-length 60
set -g status-interval 15
# narrow (portrait): other windows show only their number
setw -g window-status-format "#{?#{e|<:#{client_width},80}, #I , #I #W }"
setw -g window-status-current-format "[#I #W]"
setw -g window-status-current-style "fg=colour15"
setw -g window-status-separator ""
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour7"
set -g pane-border-lines single
set -g message-style "bg=colour7,fg=colour0"
set -g mode-style "bg=colour7,fg=colour0"
set -g copy-mode-position-style "bg=colour8,fg=colour15"
# Alt+m: back to the launcher (reopened if it was closed); ##W because tmux
# expands formats in the if-shell command before the shell runs it
bind -n M-m if-shell "tmux list-windows -F '##W' | grep -qx menu" "select-window -t menu" "new-window -b -t 1 -n menu s10-menu"
